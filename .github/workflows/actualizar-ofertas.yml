name: Actualizar Ofertas

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas
    - cron: '0 */2 * * *'
  # Te permite ejecutarlo manualmente cuando quieras desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar ofertas desde Apps Script
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbx0MswkLKTdb-gRk3k8LIuLWPMbXbvj-ghS9xo852YjXpdwSmMPEpMjCMvlk2oJaTtGgQ/exec" -o ofertas.json

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --staged --quiet || (git commit -m "Auto: Actualizar ofertas diarias [skip ci]" && git push)
